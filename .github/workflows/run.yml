name: ARM64 Runner Android Diagnostics

on:
  workflow_dispatch:

jobs:
  arm64:
    name: ARM64 diagnostics
    runs-on: ubuntu-24.04-arm

    steps:
      - name: System information
        run: |
          set -eux

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          echo "Architecture:"
          uname -m

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "CPU:"
          lscpu

      - name: Check virtualization
        run: |
          echo "=========================================="
          echo "VIRTUALIZATION / KVM"
          echo "=========================================="

          echo "Architecture:"
          uname -m

          echo
          echo "/dev/kvm:"
          if [ -e /dev/kvm ]; then
            ls -la /dev/kvm
            echo "KVM DEVICE: AVAILABLE"
          else
            echo "KVM DEVICE: NOT AVAILABLE"
          fi

          echo
          echo "KVM modules:"
          lsmod | grep -i kvm || echo "No KVM modules loaded"

          echo
          echo "CPU virtualization information:"
          lscpu | grep -Ei \
            'Architecture|Model name|Virtualization|Hypervisor|Flags' \
            || true

      - name: Install basic packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            qemu-system-arm \
            qemu-system-aarch64 \
            qemu-utils \
            cpu-checker

      - name: Check QEMU
        run: |
          echo "=========================================="
          echo "QEMU"
          echo "=========================================="

          qemu-system-aarch64 --version

          echo
          echo "QEMU binary:"
          file "$(command -v qemu-system-aarch64)"

      - name: Test QEMU without KVM
        run: |
          echo "=========================================="
          echo "QEMU SOFTWARE EMULATION"
          echo "=========================================="

          qemu-system-aarch64 \
            --version

          echo
          echo "Attempting to start a minimal ARM64 VM without KVM..."

          timeout 15 \
            qemu-system-aarch64 \
            -machine virt \
            -cpu max \
            -nographic \
            -nodefaults \
            -serial mon:stdio \
            -S \
            </dev/null \
            > /tmp/qemu.log 2>&1 || true

          echo
          echo "QEMU output:"
          cat /tmp/qemu.log || true

      - name: Inspect Android package availability
        run: |
          echo "=========================================="
          echo "ANDROID PACKAGE AVAILABILITY"
          echo "=========================================="

          echo "Checking whether Android SDK is preinstalled..."

          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME"
          else
            echo "ANDROID_HOME is not set"
          fi

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          else
            echo "ANDROID_SDK_ROOT is not set"
          fi

          echo
          echo "ADB:"
          adb version || true

          echo
          echo "Android SDK directories:"
          find /usr/local/lib/android /opt/android "$HOME/Android" \
            -maxdepth 3 \
            -type d \
            2>/dev/null \
            | head -100 || true

      - name: Test Android SDK manager
        run: |
          echo "=========================================="
          echo "SDKMANAGER"
          echo "=========================================="

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager exists:"
            command -v sdkmanager
            sdkmanager --version || true

            echo
            echo "Android emulator package:"
            sdkmanager --list 2>&1 \
              | grep -i -E \
                '(^|[[:space:]])emulator([[:space:]]|$)|system-images' \
              | head -100 || true
          else
            echo "sdkmanager is NOT installed on this ARM64 runner."
          fi

      - name: Check Android emulator binary
        run: |
          echo "=========================================="
          echo "ANDROID EMULATOR"
          echo "=========================================="

          if command -v emulator >/dev/null 2>&1; then
            echo "emulator command:"
            command -v emulator

            echo
            file "$(command -v emulator)"

            echo
            emulator -version || true
          else
            echo "NO Android emulator binary is installed."
          fi

          echo
          echo "Searching filesystem:"
          find /usr/local /opt "$HOME" \
            -type f \
            -name emulator \
            -executable \
            2>/dev/null \
            | head -50 || true

      - name: Architecture compatibility test
        run: |
          echo "=========================================="
          echo "ARCHITECTURE COMPATIBILITY"
          echo "=========================================="

          echo "Host:"
          uname -m

          echo
          echo "Installed emulator candidates:"

          find /usr/local /opt "$HOME" \
            -type f \
            -name emulator \
            -executable \
            2>/dev/null \
            | while read -r binary; do
                echo
                echo "Binary: $binary"
                file "$binary"
              done

      - name: Final result
        run: |
          echo
          echo "=========================================="
          echo "FINAL RESULT"
          echo "=========================================="

          echo "Native ARM64:"
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "YES"
          else
            echo "NO"
          fi

          echo
          echo "KVM:"
          if [ -e /dev/kvm ]; then
            echo "AVAILABLE"
          else
            echo "NOT AVAILABLE"
          fi

          echo
          echo "Android emulator:"
          if command -v emulator >/dev/null 2>&1; then
            echo "BINARY FOUND"
          else
            echo "NOT INSTALLED"
          fi

          echo
          echo "=========================================="