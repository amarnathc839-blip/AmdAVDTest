name: ARM64 Android Emulator Test

on:
  workflow_dispatch:

jobs:
  arm64-avd:
    runs-on: ubuntu-24.04-arm

    steps:

      # ============================================================
      # Runner information
      # ============================================================
      - name: Runner information
        run: |
          echo "========================================"
          echo "RUNNER"
          echo "========================================"

          echo "Architecture:"
          uname -m

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "CPU:"
          lscpu

      # ============================================================
      # KVM test
      # ============================================================
      - name: Check KVM
        run: |
          echo "========================================"
          echo "KVM"
          echo "========================================"

          if [ -e /dev/kvm ]; then
            echo "✅ /dev/kvm exists"
            ls -la /dev/kvm
          else
            echo "❌ /dev/kvm does not exist"
          fi

          echo
          echo "KVM modules:"
          lsmod | grep -i kvm || true

      # ============================================================
      # Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            git \
            adb \
            openjdk-17-jdk \
            libgl1 \
            libpulse0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libnss3 \
            libxdamage1 \
            libxfixes3 \
            libgbm1

      # ============================================================
      # Android SDK command line tools
      # ============================================================
      - name: Install Android command line tools
        run: |
          set -eux

          export ANDROID_HOME="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget \
            -O /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv \
            "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # ============================================================
      # Verify sdkmanager
      # ============================================================
      - name: Verify sdkmanager
        run: |
          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          sdkmanager --version

          echo
          echo "Available packages containing emulator:"
          sdkmanager --list | grep -i emulator | head -30 || true

      # ============================================================
      # Accept licenses
      # ============================================================
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      # ============================================================
      # Install SDK components
      # ============================================================
      - name: Install Android SDK components
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;arm64-v8a"

      # ============================================================
      # Find/install emulator
      # ============================================================
      - name: Install Android emulator
        run: |
          set -eux

          echo "Checking sdkmanager emulator package..."

          if sdkmanager --list | grep -q "^  emulator "; then
            echo "Installing emulator through sdkmanager..."
            sdkmanager "emulator"
          else
            echo "sdkmanager does not expose emulator package."
            echo "Checking SDK installation..."

            find "$ANDROID_HOME" \
              -maxdepth 3 \
              -type f \
              -name emulator \
              -print || true
          fi

          echo
          echo "Android SDK contents:"
          find "$ANDROID_HOME" -maxdepth 2 -type d | sort

      # ============================================================
      # Check emulator binary
      # ============================================================
      - name: Check emulator
        run: |
          echo "========================================"
          echo "EMULATOR"
          echo "========================================"

          if command -v emulator >/dev/null 2>&1; then
            echo "✅ Emulator found"
            which emulator
            emulator -version
          else
            echo "❌ Emulator binary not found"

            find "$ANDROID_HOME" \
              -type f \
              -name emulator \
              -print

            exit 1
          fi

      # ============================================================
      # Create AVD
      # ============================================================
      - name: Create ARM64 AVD
        run: |
          set -eux

          echo "no" | avdmanager create avd \
            --force \
            --name arm64-test \
            --package "system-images;android-35;google_apis;arm64-v8a" \
            --device "pixel_6"

          echo
          echo "AVDs:"
          emulator -list-avds

      # ============================================================
      # Show AVD config
      # ============================================================
      - name: Show AVD configuration
        run: |
          cat "$HOME/.android/avd/arm64-test.avd/config.ini"

      # ============================================================
      # Start emulator WITHOUT KVM
      # ============================================================
      - name: Start ARM64 emulator
        run: |
          set -eux

          emulator \
            -avd arm64-test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel off \
            -verbose \
            > /tmp/emulator.log 2>&1 &

          echo $! > /tmp/emulator.pid

          echo "Emulator started:"
          cat /tmp/emulator.pid

          sleep 15

          echo
          echo "========================================"
          echo "EMULATOR LOG"
          echo "========================================"

          tail -200 /tmp/emulator.log || true

      # ============================================================
      # Wait for ADB
      # ============================================================
      - name: Wait for ADB
        run: |
          set -eux

          timeout 300 adb wait-for-device

          adb devices -l

      # ============================================================
      # Wait for Android boot
      # ============================================================
      - name: Wait for Android boot
        run: |
          set -eux

          timeout 600 bash -c '
            while true; do

              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")

              echo "boot_completed=$boot"

              if [ "$boot" = "1" ]; then
                break
              fi

              sleep 5
            done
          '

          echo "✅ Android boot completed"

      # ============================================================
      # Verify Android architecture
      # ============================================================
      - name: Verify Android ARM64
        run: |
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ABI:"
          adb shell getprop ro.product.cpu.abi

          echo
          echo "ABI list:"
          adb shell getprop ro.product.cpu.abilist

          echo
          echo "Android:"
          adb shell getprop ro.build.version.release

          echo
          echo "SDK:"
          adb shell getprop ro.build.version.sdk

          echo
          echo "Hardware:"
          adb shell getprop ro.hardware

      # ============================================================
      # Basic test
      # ============================================================
      - name: Test emulator
        run: |
          set -eux

          adb devices -l

          echo
          adb shell uptime

          echo
          adb shell getprop ro.product.cpu.abilist

          echo
          adb shell pm list packages | head -20

          echo
          echo "✅ ARM64 Android emulator test completed"

      # ============================================================
      # Upload logs
      # ============================================================
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-emulator-logs
          path: /tmp/emulator.log

      # ============================================================
      # Cleanup
      # ============================================================
      - name: Stop emulator
        if: always()
        run: |
          adb emu kill 2>/dev/null || true

          if [ -f /tmp/emulator.pid ]; then
            kill "$(cat /tmp/emulator.pid)" 2>/dev/null || true
          fi