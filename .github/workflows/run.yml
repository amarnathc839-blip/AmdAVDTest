name: ARM64 SSH

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Runner info
        run: |
          uname -a
          uname -m
          ls -la /dev/kvm || true

      - name: SSH into runner
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false